<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choix du style</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;600&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Instrument+Serif&family=Inter+Tight:wght@400;600&family=Unbounded:wght@500;700&family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- La page de choix (neutre, pour laisser parler les styles) ---------- */
:root{
  --p-fond:#f1f1ef; --p-carte:#ffffff; --p-texte:#111111; --p-doux:#55554f; --p-bouton:#111111; --p-bouton-texte:#ffffff; --p-pastille:#e3e3df;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --p-fond:#0c0c0c; --p-carte:#161616; --p-texte:#f2f2f2; --p-doux:#b0b0aa; --p-bouton:#f2f2f2; --p-bouton-texte:#111111; --p-pastille:#2a2a2a;
  }
}
:root[data-theme="dark"]{
  --p-fond:#0c0c0c; --p-carte:#161616; --p-texte:#f2f2f2; --p-doux:#b0b0aa; --p-bouton:#f2f2f2; --p-bouton-texte:#111111; --p-pastille:#2a2a2a;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--p-fond);color:var(--p-texte);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:150px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}

.entete{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
.entete h1{font-size:clamp(28px,6vw,44px);line-height:1.05;letter-spacing:-.03em;font-weight:600}
.entete p{color:var(--p-doux);margin-top:10px;max-width:60ch}

.outils{position:sticky;top:0;z-index:5;background:var(--p-fond);padding:10px 16px}
.outils-dedans{max-width:1100px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--p-pastille);font-weight:600;font-size:15px}
.onglet[aria-current="true"]{background:var(--p-bouton);color:var(--p-bouton-texte)}
.modes{display:flex;background:var(--p-pastille);border-radius:999px;padding:3px}
.modes button{min-height:44px;min-width:64px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:600}
.modes button[aria-pressed="true"]{background:var(--p-carte)}

.rail{position:relative;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px 24px;scroll-padding:16px;scrollbar-width:thin;overscroll-behavior-x:contain}
.carte-style{flex:0 0 min(400px,calc(100vw - 32px));scroll-snap-align:start;background:var(--p-carte);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:18px}
.carte-style.choisi{outline:3px solid var(--p-texte);outline-offset:-3px}
.carte-tete h2{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.carte-tete .num{color:var(--p-doux);font-size:14px}
.carte-tete p{margin-top:6px}
.bloc h3{font-size:15px;margin-bottom:8px}
.bloc p,.bloc li{font-size:15px}
.bloc ul{padding-left:18px;display:grid;gap:6px}
.pourquoi{color:var(--p-doux)}
.nuancier{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.nuancier .ronds{display:flex;gap:6px}
.nuancier .rond{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.logos{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.icone-app{width:60px;height:60px;border-radius:14px;display:grid;place-items:center}
.icone-app svg{width:34px;height:34px}
.polices .exemple-titre{font-size:30px;line-height:1.1}
.polices .exemple-texte{font-size:16px;margin-top:4px}
.choisir{min-height:52px;border:0;border-radius:999px;background:var(--p-bouton);color:var(--p-bouton-texte);font-weight:600;font-size:16px}
.choisi .choisir{background:var(--p-pastille);color:var(--p-texte)}

.barre-choix{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--p-carte);padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.barre-dedans{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.barre-choix .resume{flex:1 1 100%;font-size:14px;line-height:1.3}
.barre-choix input{flex:1 1 140px;min-width:0;min-height:46px;border:0;border-radius:999px;background:var(--p-pastille);padding:0 16px;font:inherit;font-size:16px;color:inherit}
.barre-choix .copier{min-height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--p-bouton);color:var(--p-bouton-texte);font-weight:600}
.bulle{position:fixed;top:16px;left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--p-texte);color:var(--p-fond);padding:10px 18px;border-radius:999px;font-weight:600;transition:.25s;z-index:9;pointer-events:none}
.bulle.vue{opacity:1;transform:translate(-50%,0)}

/* ---------- Le téléphone : la salle de l'hôte, dessinée dans chaque style ---------- */
.tel{border-radius:34px;padding:10px;background:#1b1b1b}
.ecran{border-radius:26px;overflow:hidden;background:var(--fond);color:var(--texte);font-family:var(--police-texte);font-size:14px;line-height:1.45;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;position:relative;isolation:isolate}
.ecran *{font-family:inherit}
.haut{display:flex;align-items:center;gap:8px}
.haut .marque{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--texte)}
.haut .marque svg{width:22px;height:22px;color:var(--logo)}
.haut .fermer{margin-left:auto;min-height:36px;padding:0 14px;border:0;border-radius:var(--rayon-bouton);background:var(--danger);color:#fff;font-size:13px;font-weight:600}
.titre-salle{font-family:var(--police-titre);font-size:30px;line-height:1;letter-spacing:var(--titre-serre);font-weight:var(--titre-graisse)}
.scene{position:relative;display:grid;place-items:center;height:210px;border-radius:var(--rayon-carte);background:var(--scene-fond);overflow:hidden}
.scene svg.objet{width:180px;height:180px;overflow:visible}
.scene .temps{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--scene-doux)}
.code-bloc{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--carte);border-radius:var(--rayon-carte);padding:14px}
.code{font-family:var(--police-titre);font-size:38px;line-height:1;letter-spacing:var(--code-serre);font-weight:var(--titre-graisse);font-variant-numeric:tabular-nums;white-space:nowrap}
.qr{width:74px;height:74px;background:#fff;border-radius:10px;padding:4px;grid-row:span 2}
.aide{font-size:12px;color:var(--doux);line-height:1.35}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{min-height:40px;border:0;border-radius:var(--rayon-bouton);background:var(--carte2);color:var(--texte);font-size:13px;font-weight:600}
.etat{display:flex;gap:10px;align-items:center;font-size:12.5px}
.etat svg{width:30px;height:30px;flex:0 0 auto}
.bandeau{background:var(--alerte-fond);color:var(--alerte-texte);border-radius:12px;padding:9px 12px;font-size:12.5px}
.msg{background:var(--carte);border-radius:var(--rayon-carte);padding:12px}
.msg .qui{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
.msg .qui span{color:var(--doux);font-weight:400}
.fichier{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}
.vignette{width:38px;height:38px;border-radius:var(--rayon-vignette);background:var(--carte2);display:grid;place-items:center;font-size:10px;font-weight:700}
.fichier .nom{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fichier .taille{font-size:12px;color:var(--doux)}
.piste{height:8px;border-radius:99px;background:var(--carte2);margin-top:10px;overflow:hidden}
.piste i{display:block;height:100%;width:62%;background:var(--accent);border-radius:99px;transform-origin:left}
.ligne-envoi{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px}
.ligne-envoi button{min-height:32px;padding:0 12px;border:0;border-radius:var(--rayon-bouton);background:var(--carte2);color:var(--texte);font-size:12px;font-weight:600}
.bas{display:grid;grid-template-columns:40px 1fr auto;gap:6px;align-items:center}
.bas .plus{width:40px;height:40px;border:0;border-radius:50%;background:var(--carte2);color:var(--texte);font-size:20px;line-height:1}
.bas .champ{min-height:40px;border-radius:var(--rayon-bouton);background:var(--carte);color:var(--doux);display:flex;align-items:center;padding:0 12px;font-size:13px}
.bas .envoyer{min-height:40px;padding:0 14px;border:0;border-radius:var(--rayon-bouton);background:var(--bouton);color:var(--bouton-texte);font-weight:600;font-size:13px}

/* ---------- 1. GLACE ---------- */
[data-s="glace"]{--police-titre:"Syne",sans-serif;--police-texte:"Manrope",sans-serif;--titre-graisse:700;--titre-serre:-.02em;--code-serre:-.01em;
  --rayon-carte:22px;--rayon-bouton:999px;--rayon-vignette:10px}
[data-s="glace"][data-mode="jour"]{--fond:#e9f0f4;--carte:#ffffff;--carte2:#d6e5ee;--texte:#0b1c26;--doux:#4a5d68;--accent:#0b6e99;--logo:#0b6e99;
  --bouton:#0b1c26;--bouton-texte:#ffffff;--danger:#c3303b;--alerte-fond:#0b1c26;--alerte-texte:#e9f0f4;--scene-fond:#d3e6f0;--scene-doux:#3e5664;--glace-a:#ffffff;--glace-b:#7cc6e6}
[data-s="glace"][data-mode="nuit"]{--fond:#04111a;--carte:#0c2230;--carte2:#173749;--texte:#eef7fb;--doux:#9fb6c2;--accent:#8fdcff;--logo:#8fdcff;
  --bouton:#eef7fb;--bouton-texte:#04111a;--danger:#d23a45;--alerte-fond:#173749;--alerte-texte:#d7f2ff;--scene-fond:#081b27;--scene-doux:#9fb6c2;--glace-a:#e8f8ff;--glace-b:#3aa4d6}
/* ---------- 2. ÉCRIN ---------- */
[data-s="ecrin"]{--police-titre:"Cormorant Garamond",serif;--police-texte:"Jost",sans-serif;--titre-graisse:600;--titre-serre:-.01em;--code-serre:.02em;
  --rayon-carte:6px;--rayon-bouton:4px;--rayon-vignette:4px}
[data-s="ecrin"][data-mode="jour"]{--fond:#f3efed;--carte:#ffffff;--carte2:#e8dfdc;--texte:#1f0d10;--doux:#6b5458;--accent:#7d1426;--logo:#7d1426;
  --bouton:#1f0d10;--bouton-texte:#ffffff;--danger:#c8322b;--alerte-fond:#1f0d10;--alerte-texte:#f3efed;--scene-fond:#5c0f1e;--scene-doux:#f0cdd3;--metal-a:#ffffff;--metal-b:#9aa0a6}
[data-s="ecrin"][data-mode="nuit"]{--fond:#120709;--carte:#211013;--carte2:#3a1c22;--texte:#f7eef0;--doux:#c7aeb3;--accent:#e0687c;--logo:#e7dfe0;
  --bouton:#f7eef0;--bouton-texte:#120709;--danger:#d63a33;--alerte-fond:#3a1c22;--alerte-texte:#ffd9df;--scene-fond:#3d0913;--scene-doux:#e9bcc4;--metal-a:#ffffff;--metal-b:#8b9096}
/* ---------- 3. DISQUE ---------- */
[data-s="disque"]{--police-titre:"Instrument Serif",serif;--police-texte:"Inter Tight",sans-serif;--titre-graisse:400;--titre-serre:-.02em;--code-serre:-.02em;
  --rayon-carte:0px;--rayon-bouton:0px;--rayon-vignette:50%}
[data-s="disque"][data-mode="jour"]{--fond:#ebeae5;--carte:#f8f8f5;--carte2:#dcdbd5;--texte:#121212;--doux:#5b5b56;--accent:#d63d12;--logo:#121212;
  --bouton:#121212;--bouton-texte:#ffffff;--danger:#c42b1c;--alerte-fond:#121212;--alerte-texte:#ebeae5;--scene-fond:#dcdbd5;--scene-doux:#4d4d48}
[data-s="disque"][data-mode="nuit"]{--fond:#0d0d0d;--carte:#191919;--carte2:#2b2b2b;--texte:#f1f0eb;--doux:#a8a7a1;--accent:#ff6a3d;--logo:#ff6a3d;
  --bouton:#f1f0eb;--bouton-texte:#0d0d0d;--danger:#d8392a;--alerte-fond:#2b2b2b;--alerte-texte:#ffd6c8;--scene-fond:#151515;--scene-doux:#a8a7a1}
/* ---------- 4. BILLES ---------- */
[data-s="billes"]{--police-titre:"Unbounded",sans-serif;--police-texte:"DM Sans",sans-serif;--titre-graisse:700;--titre-serre:-.03em;--code-serre:-.03em;
  --rayon-carte:28px;--rayon-bouton:999px;--rayon-vignette:50%}
[data-s="billes"][data-mode="jour"]{--fond:#f4f4f2;--carte:#ffffff;--carte2:#e6e7ee;--texte:#0e0e10;--doux:#5b5b63;--accent:#2340ff;--logo:#2340ff;
  --bouton:#2340ff;--bouton-texte:#ffffff;--danger:#d3302f;--alerte-fond:#0e0e10;--alerte-texte:#f4f4f2;--scene-fond:#ffffff;--scene-doux:#5b5b63;--bille-a:#ffffff;--bille-b:#0e0e10}
[data-s="billes"][data-mode="nuit"]{--fond:#0b0b0d;--carte:#17171b;--carte2:#272730;--texte:#f4f4f6;--doux:#a6a6af;--accent:#7387ff;--logo:#7387ff;
  --bouton:#7387ff;--bouton-texte:#0b0b0d;--danger:#cf3130;--alerte-fond:#272730;--alerte-texte:#dfe4ff;--scene-fond:#121216;--scene-doux:#a6a6af;--bille-a:#ffffff;--bille-b:#3a3a44}
/* ---------- 5. PETITE PLANÈTE ---------- */
[data-s="planete"]{--police-titre:"Fraunces",serif;--police-texte:"Figtree",sans-serif;--titre-graisse:600;--titre-serre:-.02em;--code-serre:-.01em;
  --rayon-carte:24px;--rayon-bouton:999px;--rayon-vignette:12px}
[data-s="planete"][data-mode="jour"]{--fond:#e5eee0;--carte:#fbfdf8;--carte2:#d2e1ca;--texte:#16251a;--doux:#4b5f50;--accent:#e2522e;--logo:#16251a;
  --bouton:#16251a;--bouton-texte:#fbfdf8;--danger:#c2302a;--alerte-fond:#16251a;--alerte-texte:#e5eee0;--scene-fond:#bcd9e6;--scene-doux:#2c4a3a;--sol-a:#9fd17f;--sol-b:#3f8a4c}
[data-s="planete"][data-mode="nuit"]{--fond:#0e1b15;--carte:#172a21;--carte2:#24402f;--texte:#eef5ec;--doux:#a9bdae;--accent:#ff8a6a;--logo:#ff8a6a;
  --bouton:#eef5ec;--bouton-texte:#0e1b15;--danger:#d63b33;--alerte-fond:#24402f;--alerte-texte:#ffe3d9;--scene-fond:#0a1730;--scene-doux:#a9bdae;--sol-a:#6fae68;--sol-b:#1f4f33}

/* ---------- Mouvements des scènes ---------- */
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes bague{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes reflet{from{stroke-dashoffset:0}to{stroke-dashoffset:-440}}
@keyframes chute{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx,6px),120px);opacity:0}}
@keyframes pousse{0%,100%{transform:translate(0,0)}40%{transform:translate(var(--px),var(--py))}}
@keyframes respire{0%,100%{opacity:.55}50%{opacity:1}}
.irise{position:absolute;top:50%;left:50%;width:158px;height:158px;margin:-79px 0 0 -79px;border-radius:50%;
  background:conic-gradient(from 20deg,#f5f5f2,#bfe7ff,#f7d6ff,#fff2c4,#c9ffe6,#f5f5f2,#ffd2c2,#d2dcff,#f5f5f2);animation:tourne 6s linear infinite}
.orbite-tourne{transform-origin:100px 100px;animation:tourne 22s linear infinite}
.bague-tourne{transform-origin:100px 100px;animation:bague 5s ease-in-out infinite}
.glint{animation:reflet 4.5s cubic-bezier(.6,0,.4,1) infinite}
.spot{animation:respire 5s ease-in-out infinite}
.bille.tombe{animation:chute .9s cubic-bezier(.5,0,.9,.6) forwards}
.bille.pousse{animation:pousse .5s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (min-width:900px){
  .rail{padding-left:max(16px,calc((100vw - 1100px)/2));scroll-padding-left:max(16px,calc((100vw - 1100px)/2))}
}
</style>
</head>
<body>

<header class="entete">
  <h1>Ton nouveau look : 5 styles</h1>
  <p>Chaque style garde l'anneau qui se vide comme logo. Glisse d'un style à l'autre, essaie le jour et la nuit, puis choisis en bas de la page.</p>
</header>

<div class="outils">
  <div class="outils-dedans">
    <nav class="onglets" aria-label="Aller à un style" id="onglets"></nav>
    <div class="modes" role="group" aria-label="Jour ou nuit">
      <button type="button" data-mode="jour" aria-pressed="false">Jour</button>
      <button type="button" data-mode="nuit" aria-pressed="false">Nuit</button>
    </div>
  </div>
</div>

<main class="rail" id="rail"></main>

<div class="barre-choix">
  <div class="barre-dedans">
    <p class="resume" id="resume" aria-live="polite">Aucun style choisi pour l'instant.</p>
    <label class="sr" for="melange" style="position:absolute;left:-9999px">Mélange (facultatif)</label>
    <input id="melange" type="text" placeholder="Mélange (facultatif)" autocomplete="off">
    <button type="button" class="copier" id="copier">Copier mon choix</button>
  </div>
</div>
<div class="bulle" id="bulle" role="status"></div>

<script>
// ---------- Les 5 styles ----------
const STYLES = [
  {id:"glace", nom:"Glace",
   idee:"L'anneau est taillé dans la glace. Il fond doucement pendant que le temps passe, et un reflet de lumière glisse dessus.",
   logo:'<circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="4.5"/><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="50 69.1" transform="rotate(-90 16 16)"/><path d="M16 12.2 19.8 16 16 19.8 12.2 16Z" fill="currentColor"/>',
   icone:{fond:"#04111a", logo:"#8fdcff"},
   polices:["Syne","Manrope","titre large et froid, comme une lame de glace","texte net, très lisible en petit"],
   jour:["#e9f0f4","#0b1c26","#0b6e99","#d6e5ee"], nuit:["#04111a","#eef7fb","#8fdcff","#173749"],
   signature:"L'anneau de glace qui fond, avec son reflet qui glisse (inspiré d'Igloo).",
   effets:[
     ["Effet star : l'anneau fond et un reflet de lumière court dessus.","premium 3D, smooth transitions"],
     ["Les blocs se posent un par un, comme de la buée qui apparaît.","smooth transitions"],
     ["Au toucher, le bouton s'enfonce un peu, comme une touche en verre.","tactile UI"]],
   pourquoi:[
     "Bleu glacier et blanc seulement : le bleu dit le calme et la confiance (cerveau design, partie 5), et une palette courte reste maîtrisée (règle 8).",
     "Le froid et le vide autour de l'anneau font l'écrin : « le vide est un outil » (règle 3) et ton humeur PREMIUM / ÉCRIN."]},
  {id:"ecrin", nom:"Écrin",
   idee:"L'anneau devient une bague posée dans une alcôve de velours, éclairée comme dans une vitrine de joaillier. La pierre avance à mesure que le temps passe.",
   logo:'<circle cx="16" cy="17" r="10.5" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><circle cx="16" cy="17" r="10.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="47.5 66" transform="rotate(-90 16 17)"/><path d="M16 2.5 20 6.5 16 10.5 12 6.5Z" fill="currentColor"/>',
   icone:{fond:"#5c0f1e", logo:"#f3efed"},
   polices:["Cormorant Garamond","Jost","titre à empattements fins, classique et précieux","texte géométrique et calme"],
   jour:["#f3efed","#1f0d10","#7d1426","#e8dfdc"], nuit:["#120709","#f7eef0","#e0687c","#3a1c22"],

// ---------- Les scènes (la touche signature de chaque style) ----------
const C = 2*Math.PI*70; // longueur du grand anneau
const RESTE = 24/30;
function arc(r, f, attrs){ const c=2*Math.PI*r; return `<circle cx="100" cy="100" r="${r}" fill="none" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 100 100)" ${attrs}/>`; }
const SCENES = {
  glace: () => `<svg class="objet" viewBox="0 0 200 200" aria-hidden="true">
    <defs><linearGradient id="g-glace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--glace-a)"/><stop offset="1" stop-color="var(--glace-b)"/></linearGradient></defs>
    ${arc(70,1,'stroke="var(--glace-b)" stroke-opacity=".18" stroke-width="18"')}
    ${arc(70,RESTE,'class="anneau-vie" stroke="url(#g-glace)" stroke-width="18" stroke-linecap="round"')}
    ${arc(70,RESTE,'stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" class="glint" style="stroke-dasharray:18 422"')}
    <path d="M100 86 114 100 100 114 86 100Z" fill="url(#g-glace)"/></svg><p class="temps">24 min avant la fermeture</p>`,
  ecrin: () => `<svg class="objet" viewBox="0 0 200 200" aria-hidden="true">
    <defs><radialGradient id="g-spot" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--metal-b)"/><stop offset=".45" stop-color="var(--metal-a)"/><stop offset="1" stop-color="var(--metal-b)"/></linearGradient></defs>
    <circle class="spot" cx="100" cy="92" r="100" fill="url(#g-spot)"/>
    <ellipse cx="100" cy="178" rx="60" ry="8" fill="#000" fill-opacity=".25"/>
    <g class="bague-tourne">
      ${arc(62,1,'stroke="#fff" stroke-opacity=".12" stroke-width="10"')}
      ${arc(62,RESTE,'stroke="url(#g-metal)" stroke-width="10" stroke-linecap="round"')}
      <path d="M100 22 114 38 100 54 86 38Z" fill="url(#g-metal)"/><path d="M100 22 107 38 100 54Z" fill="#fff" fill-opacity=".6"/>
    </g></svg><p class="temps">24 min avant la fermeture</p>`,
  disque: () => `<div class="irise" aria-hidden="true"></div><svg class="objet" viewBox="0 0 200 200" aria-hidden="true" style="position:relative">
    ${arc(60,1,'stroke="var(--texte)" stroke-opacity=".08" stroke-width="40"')}
    ${arc(60,RESTE,'stroke="var(--accent)" stroke-opacity=".9" stroke-width="6" stroke-linecap="butt"')}
    <circle cx="100" cy="100" r="22" fill="var(--scene-fond)"/><circle cx="100" cy="100" r="8" fill="var(--fond)"/></svg><p class="temps">24 min avant la fermeture</p>`,
  billes: () => { let s=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*2*Math.PI/10, x=100+68*Math.cos(a), y=100+68*Math.sin(a), vide=i>=8;
      s+=`<circle class="bille${vide?' partie':''}" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="${vide?'var(--carte2)':'url(#g-bille)'}" style="transform-box:fill-box;transform-origin:center"/>`; }
    return `<svg class="objet" viewBox="0 0 200 200" aria-hidden="true" style="cursor:pointer">
    <defs><radialGradient id="g-bille" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="var(--bille-a)"/><stop offset=".25" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--bille-b)"/></radialGradient></defs>
    ${s}<circle cx="100" cy="100" r="16" fill="url(#g-bille)"/></svg><p class="temps">8 billes sur 10 · touche l'anneau</p>`; },
  planete: () => `<svg class="objet" viewBox="0 0 200 200" aria-hidden="true">
    <defs><radialGradient id="g-sol" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="var(--sol-a)"/><stop offset="1" stop-color="var(--sol-b)"/></radialGradient></defs>
    ${arc(76,1,'stroke="var(--scene-doux)" stroke-opacity=".25" stroke-width="3"')}
    ${arc(76,RESTE,'stroke="var(--accent)" stroke-width="4" stroke-linecap="round"')}
    <g class="orbite-tourne"><circle cx="100" cy="24" r="8" fill="#fbfdf8"/><circle cx="165.8" cy="138" r="6" fill="#fbfdf8"/><circle cx="34.2" cy="138" r="7" fill="#fbfdf8"/></g>
    <circle cx="100" cy="100" r="42" fill="url(#g-sol)"/>
    <path d="M70 92c10-6 22-4 28 2s16 6 22 0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="116" cy="118" r="7" fill="#fff" fill-opacity=".22"/></svg><p class="temps">3 lunes : 3 personnes connectées</p>`
};

// Un faux QR code (pour la maquette seulement)
function qr(seed){
  let x=seed, rnd=()=>((x=(x*9301+49297)%233280)/233280);
  const n=21; let p='';
  const coin=(cx,cy)=>{ p+=`M${cx} ${cy}h7v7h-7zM${cx+1} ${cy+1}v5h5v-5zM${cx+2} ${cy+2}h3v3h-3z`; };
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const dansCoin=(i<8&&j<8)||(i<8&&j>12)||(i>12&&j<8); if(!dansCoin && rnd()>.52) p+=`M${j} ${i}h1v1h-1z`; }
  coin(0,0); coin(14,0); coin(0,14);
  return `<svg class="qr" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-label="QR code"><path fill="#111" fill-rule="evenodd" d="${p}"/></svg>`;
}

function anneauEtat(){ return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--carte2)" stroke-width="5"/><circle cx="20" cy="20" r="15" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(94.2*RESTE).toFixed(1)} 94.2" transform="rotate(-90 20 20)"/></svg>`; }

function telephone(s, i){
  return `<div class="tel"><div class="ecran" data-s="${s.id}" data-mode="jour">
    <div class="haut"><span class="marque"><svg viewBox="0 0 32 32" aria-hidden="true">${s.logo}</svg>Partage éphémère</span><button type="button" class="fermer" tabindex="-1">Fermer la salle</button></div>
    <div class="titre-salle">Ta salle</div>
    <div class="scene">${SCENES[s.id]()}</div>
    <div class="code-bloc"><div class="code">482 915</div>${qr(17+i*31)}<p class="aide">Les invités scannent ce QR code avec l'appareil photo de leur téléphone.</p></div>
    <div class="duo"><button type="button" class="btn2" tabindex="-1">Copier le code</button><button type="button" class="btn2" tabindex="-1">Partager le lien</button></div>
    <div class="etat">${anneauEtat()}<span>3 personnes connectées · Fermeture automatique dans 24 min</span></div>
    <p class="bandeau">Ne verrouille pas ton écran : la salle se fermerait pour tout le monde.</p>
    <div class="msg"><div class="qui">Invité 2 <span>14:32</span></div>Le lien pour samedi : resa.fr/7Q2K</div>
    <div class="msg"><div class="qui">Moi <span>14:33</span></div>
      <div class="fichier"><div class="vignette">MOV</div><div style="min-width:0"><div class="nom">Vacances-Nice-plage.mov</div><div class="taille">418 Mo</div></div></div>
      <div class="piste"><i class="barre"></i></div>
      <div class="ligne-envoi"><span>62 %</span><button type="button" tabindex="-1">Annuler</button></div>
      <p class="aide" style="margin-top:6px">Garde cet écran ouvert pendant l'envoi.</p></div>
    <div class="bas"><button type="button" class="plus" tabindex="-1" aria-label="Ajouter un fichier">+</button><span class="champ">Écrire un message…</span><button type="button" class="envoyer" tabindex="-1">Envoyer</button></div>
  </div></div>`;
}

function rond(c){ return `<span class="rond" style="background:${c}" title="${c}"></span>`; }

function carte(s, i){
  return `<article class="carte-style" id="style-${s.id}" aria-labelledby="t-${s.id}">
    <div class="carte-tete"><span class="num">Style ${i+1} sur 5</span><h2 id="t-${s.id}">${s.nom}</h2><p>${s.idee}</p></div>
    ${telephone(s, i)}
    <div class="bloc"><h3>Couleurs</h3><div class="nuancier">
      <span>Jour</span><span class="ronds">${s.jour.map(rond).join('')}</span>
      <span>Nuit</span><span class="ronds">${s.nuit.map(rond).join('')}</span></div>
      <p class="aide-p" style="font-size:13px;color:var(--p-doux);margin-top:6px">Dans l'ordre : fond, texte, accent, couleur douce.</p></div>
    <div class="bloc polices"><h3>Polices</h3>
      <div class="exemple-titre" style="font-family:'${s.polices[0]}'">Ta salle 482 915</div>
      <div class="exemple-texte" style="font-family:'${s.polices[1]}'">Envoie du texte et des fichiers, sans compte.</div>
      <p style="font-size:13px;color:var(--p-doux);margin-top:6px">${s.polices[0]} : ${s.polices[2]}. ${s.polices[1]} : ${s.polices[3]}.</p></div>
    <div class="bloc"><h3>Logo et icône</h3><div class="logos">
      <span class="icone-app" style="background:${s.icone.fond};color:${s.icone.logo}"><svg viewBox="0 0 32 32" aria-label="Icône de l'app">${s.logo}</svg></span>
      <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">${s.logo}</svg>
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">${s.logo}</svg>
      <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">${s.logo}</svg></div></div>
    <div class="bloc"><h3>Touche signature</h3><p>${s.signature}</p></div>
    <div class="bloc"><h3>Effets (et le mot-clé qu'ils servent)</h3><ul>${s.effets.map(e=>`<li>${e[0]} <span class="pourquoi">(${e[1]})</span></li>`).join('')}</ul></div>
    <div class="bloc"><h3>Pourquoi ces choix</h3><ul class="pourquoi">${s.pourquoi.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    <button type="button" class="choisir" data-id="${s.id}" aria-pressed="false">Je choisis ${s.nom}</button>
  </article>`;
}

const rail = document.getElementById('rail');
rail.innerHTML = STYLES.map(carte).join('');
document.getElementById('onglets').innerHTML = STYLES.map((s,i)=>`<button type="button" class="onglet" data-cible="${s.id}">${i+1}. ${s.nom}</button>`).join('');

// ---------- Jour / nuit (suit l'appareil au départ) ----------
const prefereNuit = matchMedia('(prefers-color-scheme: dark)');
function appliquerMode(m){
  document.querySelectorAll('.ecran').forEach(e=>e.dataset.mode=m);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===m));
}
appliquerMode(prefereNuit.matches?'nuit':'jour');
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>appliquerMode(b.dataset.mode)));

// ---------- Onglets : aller au style ----------
const onglets=[...document.querySelectorAll('.onglet')];
onglets.forEach(o=>o.addEventListener('click',()=>{
  const c=document.getElementById('style-'+o.dataset.cible);
  rail.scrollTo({left:c.offsetLeft-parseFloat(getComputedStyle(rail).scrollPaddingLeft||16), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}));
const cartes=[...document.querySelectorAll('.carte-style')];
// L'onglet allumé = le style le plus à gauche du rail
function majOnglet(){
  const g=rail.scrollLeft+parseFloat(getComputedStyle(rail).scrollPaddingLeft||16);
  const c=cartes.reduce((a,b)=>Math.abs(b.offsetLeft-g)<Math.abs(a.offsetLeft-g)?b:a);
  onglets.forEach(o=>o.setAttribute('aria-current', o.dataset.cible===c.id.slice(6)));
}
rail.addEventListener('scroll',()=>requestAnimationFrame(majOnglet),{passive:true});
majOnglet();

// ---------- Billes : une bille tombe, et on peut les pousser ----------
const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
const svgBilles = document.querySelector('[data-s="billes"] svg.objet');
svgBilles.addEventListener('click',()=>{
  svgBilles.querySelectorAll('.bille:not(.partie)').forEach(b=>{
    const a=Math.atan2(b.getAttribute('cy')-100,b.getAttribute('cx')-100);
    b.style.setProperty('--px',(Math.cos(a)*10).toFixed(1)+'px'); b.style.setProperty('--py',(Math.sin(a)*10).toFixed(1)+'px');
    b.classList.remove('pousse'); void b.getBBox(); b.classList.add('pousse');
  });
});
if(!calme){
  setInterval(()=>{
    const restantes=[...svgBilles.querySelectorAll('.bille:not(.partie)')];
    if(restantes.length<=3){ // on remet le collier pour la démo
      svgBilles.querySelectorAll('.bille').forEach((b,i)=>{ b.classList.remove('tombe','partie'); b.setAttribute('fill', i>=8?'var(--carte2)':'url(#g-bille)'); if(i>=8) b.classList.add('partie'); });
      return;
    }
    const b=restantes[restantes.length-1];
    const fantome=b.cloneNode(); fantome.classList.add('tombe'); b.after(fantome);
    fantome.addEventListener('animationend',()=>fantome.remove());
    b.classList.add('partie'); b.setAttribute('fill','var(--carte2)');
  },3200);
}

// ---------- Écrin : la lumière suit le doigt ----------
const sceneEcrin = document.querySelector('[data-s="ecrin"] .scene');
sceneEcrin.addEventListener('pointermove',ev=>{
  const r=sceneEcrin.getBoundingClientRect(), spot=sceneEcrin.querySelector('.spot');
  spot.setAttribute('cx', (ev.clientX-r.left)/r.width*200); spot.setAttribute('cy', (ev.clientY-r.top)/r.height*200);
});

// ---------- Glace : l'anneau fond doucement (démo en 20 s) ----------
if(!calme){
  const arcG=document.querySelector('[data-s="glace"] .anneau-vie'), t0=performance.now();
  (function boucle(t){
    const f = RESTE*(1-((t-t0)%20000)/20000*0.75);
    arcG.setAttribute('stroke-dasharray', `${(C*f).toFixed(1)} ${C.toFixed(1)}`);
    requestAnimationFrame(boucle);
  })(t0);
}

// ---------- Le choix ----------
let choix=null;
const resume=document.getElementById('resume');
document.querySelectorAll('.choisir').forEach(b=>b.addEventListener('click',()=>{
  choix = choix===b.dataset.id ? null : b.dataset.id;
  document.querySelectorAll('.choisir').forEach(x=>{ const on=x.dataset.id===choix; x.setAttribute('aria-pressed',on); x.closest('.carte-style').classList.toggle('choisi',on); const s=STYLES.find(y=>y.id===x.dataset.id); x.textContent = on?`${s.nom} est choisi ✓`:`Je choisis ${s.nom}`; });
  const s=STYLES.find(y=>y.id===choix);
  resume.textContent = s ? `Ton choix : style ${STYLES.indexOf(s)+1}, ${s.nom}.` : "Aucun style choisi pour l'instant.";
}));
const bulle=document.getElementById('bulle');
function montrer(t){ bulle.textContent=t; bulle.classList.add('vue'); clearTimeout(montrer.t); montrer.t=setTimeout(()=>bulle.classList.remove('vue'),2200); }
document.getElementById('copier').addEventListener('click',async()=>{
  const s=STYLES.find(y=>y.id===choix), m=document.getElementById('melange').value.trim();
  if(!s && !m){ montrer('Choisis d\'abord un style'); return; }
  const texte = `Mission 19 : je choisis le style ${s?`${STYLES.indexOf(s)+1} « ${s.nom} »`:'(mélange)'}.${m?` Mélange : ${m}`:''}`;
  try{ await navigator.clipboard.writeText(texte); montrer('Choix copié ✓'); }
  catch{ const z=document.createElement('textarea'); z.value=texte; document.body.append(z); z.select(); document.execCommand('copy'); z.remove(); montrer('Choix copié ✓'); }
});
</script>
